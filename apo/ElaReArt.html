<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M4A Loop and Autoplay</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .player-container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        p {
            color: #555;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="player-container">
    <h2>M4A Audio Loop</h2>
    <!-- The 'loop' attribute handles infinite playback -->
    <!-- The 'controls' attribute lets users pause if needed -->
    <audio id="myAudio" loop controls>
        <source src="ElaReArt.m4a" type="audio/mp4">
        Your browser does not support the audio element.
    </audio>
    <p id="status">Click anywhere on the screen if the audio doesn't start automatically.</p>
</div>

<script>
    const audio = document.getElementById('myAudio');
    const statusText = document.getElementById('status');

    // Remove reliance on native loop and manually force a restart
    audio.removeAttribute('loop'); 

    // Explicitly listen for the 'ended' event
    audio.addEventListener('ended', function() {
        console.log("Audio ended. Forcing manual loop restart.");
        this.currentTime = 0; // Move playback tracker back to the start
        this.play().catch(err => console.log("Loop restart blocked:", err));
    }, false);

    // Initial activation script
    const playAttempt = audio.play();
    if (playAttempt !== undefined) {
        playAttempt.catch(error => {
            document.addEventListener('click', () => {
                audio.play();
                statusText.textContent = "Audio playing and forcing a manual loop via JavaScript.";
            }, { once: true });
        });
    }
</script>


</body>
</html>
