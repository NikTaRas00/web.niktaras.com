<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Navigation Menu</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f5f7;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    /* Container wraps buttons in a single vertical mobile column */
    .menu-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Styled link buttons optimized for touch interaction */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px; /* Meets 48px+ mobile tap target standard */
      padding: 14px 20px;
      background-color: #007aff;
      color: #ffffff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      transition: background-color 0.15s ease, transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }

    /* Instant visual feedback when tapped on mobile */
    .btn:active {
      background-color: #0056b3;
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="menu-container">
    <!-- Duplicate these lines to add as many buttons as you need -->
    <a href="MamaV1.jpg" class="btn">Mama 1</a>
    <a href="MamaV2.jpg" class="btn">Mama 2</a>
    <a href="ElaReArt.html" class="btn">Ela Re Artemis</a>
    <a href="PapaV1.jpg" class="btn">Babas 1</a>
	 <a href="PapaV2.png" class="btn">Babas 2</a>
  </div>

</body>
</html>
