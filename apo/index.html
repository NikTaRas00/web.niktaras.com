<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Image</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f9;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .btn {
            display: inline-block;
            width: 80%;
            max-width: 320px;
            padding: 24px 16px;
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            background-color: #007bff;
            text-align: center;
            text-decoration: none;
            border-radius: 16px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            transition: transform 0.1s ease, background-color 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active {
            transform: scale(0.96);
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <a href="Saskdjakajqoeivdakaisb.jpg" class="btn">Baba</a>
    <a href="IMG_5509.jpeg" class="btn">Mama V1</a>
    <a href="IMG_5508.jpeg" class="btn">Mama V2</a>
    <a href="ElaReArt.m4a" class="btn">Mama V3</a>
</body>
</html>
